[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
license = {text = "MIT"}
authors = [{name = "Jan Ischebeck"}]
keywords = ["architecture", "diagram", "dsl", "svg", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
name = "archDraw"
version = "0.3.1"
description = "A dual-interface architecture diagramming tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textX",
    "pyvips",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-snapshot",
]

[project.scripts]
archdraw = "archDraw.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/archDraw"]

[tool.pytest.ini_options]
pythonpath = ["src"]
